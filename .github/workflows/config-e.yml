  workflow_dispatch:
    inputs:
      required_cpu:
        description: 'Confirmatory round: run only on this processor (e.g. EPYC 7763). Empty accepts any.'
        required: false
        default: ''

permissions:
  contents: read
  actions: write # the processor gate cancels its own run

env:
  CONFIG_ID: 'E'
  SUBJECT_UPSTREAM_SHA: e55f9f0e43b022a8db6e5aac4e6d8aa247a11399
  SUBJECT_APPS_TREE: 67ca8089d5b5b7093d629ab97a83880e0db8a7ee
  SUBJECT_LIBS_TREE: 995425366961083e132a70b580f5aa83655d415b
